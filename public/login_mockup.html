<!DOCTYPE html>

<style>
        body {
            background-color: #161312;
            color: #e9e1e0;
            font-family: 'Inter', sans-serif;
        }
        .enterprise-card {
            background-color: #1e1b1b;
            border: 1px solid #383433;
        }
        .input-enterprise {
            background-color: #100e0d;
            border: 1px solid #383433;
            color: #e9e1e0;
            transition: all 0.2s ease;
        }
        .input-enterprise:focus {
            border-color: #D2042D;
            outline: none;
            box-shadow: 0 0 0 1px #D2042D;
        }
        .btn-brand {
            background-color: #D2042D;
            color: white;
            transition: opacity 0.2s ease;
        }
        .btn-brand:hover {
            opacity: 0.9;
        }
        .btn-social-yellow {
            background-color: #ecc154;
            color: #161312;
            transition: filter 0.2s ease;
        }
        .btn-social-yellow:hover {
            filter: brightness(1.05);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_center,_#221f1f_0%,_#161312_100%)]">
<div class="w-full max-w-md mx-auto">
<!-- Logo Area -->
<div class="text-center mb-10">
<h1 class="font-display-metrics text-display-metrics text-brand-deep-rose mb-1">HireSpark</h1>
<p class="font-body-md text-body-md text-on-surface-variant uppercase tracking-widest opacity-80">Enterprise Talent Intelligence</p>
</div>
<!-- Login Card -->
<div class="enterprise-card rounded-xl p-8 shadow-2xl">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-8">Welcome back</h2>
<form class="space-y-6">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="input-enterprise block w-full pl-10 pr-3 py-3 rounded font-body-md text-body-md focus:ring-0" id="email" name="email" placeholder="you@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-brand-deep-rose hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="input-enterprise block w-full pl-10 pr-3 py-3 rounded font-body-md text-body-md focus:ring-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="btn-brand w-full flex justify-center py-3.5 px-4 rounded font-label-md text-label-md font-semibold tracking-wide" type="submit">
                        SIGN IN
                    </button>
</div>
</form>
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-3 bg-[#1e1b1b] text-on-surface-variant font-label-md text-label-md">Or continue with</span>
</div>
</div>
<div class="mt-6 grid grid-cols-2 gap-4">
<button class="btn-social-yellow w-full inline-flex justify-center py-2.5 px-4 rounded font-label-md text-label-md items-center font-bold">
<span class="material-symbols-outlined mr-2 text-[18px]">account_circle</span>
                        GOOGLE
                    </button>
<button class="btn-social-yellow w-full inline-flex justify-center py-2.5 px-4 rounded font-label-md text-label-md items-center font-bold">
<span class="material-symbols-outlined mr-2 text-[18px]">work</span>
                        LINKEDIN
                    </button>
</div>
</div>
<p class="mt-10 text-center font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-brand-deep-rose font-bold hover:underline ml-1" href="#">Sign up</a>
</p>
</div>
<!-- Footer Info -->
<div class="mt-8 text-center">
<p class="text-outline text-[10px] uppercase tracking-[0.2em]">Secure Enterprise Access • © 2024 HireSpark</p>
</div>
</div>
</body></html>
